spring.application.name=api-gateway

server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=incident-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/incidents/**

spring.cloud.gateway.server.webflux.routes[1].id=response-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/teams/**

spring.cloud.gateway.server.webflux.routes[2].id=response-incident-info
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/incident-info/**

management.endpoint.gateway.enabled=true
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always